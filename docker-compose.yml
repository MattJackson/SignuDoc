# Local Postgres for development and the end-to-end test.
# To run the app itself on a laptop or server, see examples/docker-compose/.
#   npm run db:start    start it and apply migrations
#   npm run db:stop     stop it (data is kept)
#   npm run db:reset    wipe it and start fresh
#
# The app itself, built from the Dockerfile, is optional and only starts
# with the "app" profile. It keeps files on a local volume and writes email
# to /data/outbox instead of sending it:
#   docker compose --profile app up --build    then open http://localhost:3000
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: signudoc
      POSTGRES_PASSWORD: signudoc
      POSTGRES_DB: signudoc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - signudoc-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signudoc -d signudoc"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    profiles: ["app"]
    build: .
    image: signudoc:local
    command: ["node", "db/migrate.mjs"]
    environment:
      DATABASE_URL: postgres://signudoc:signudoc@db:5432/signudoc
    depends_on:
      db:
        condition: service_healthy

  app:
    profiles: ["app"]
    image: signudoc:local
    environment:
      DATABASE_URL: postgres://signudoc:signudoc@db:5432/signudoc
      APP_URL: http://localhost:3000
      BETTER_AUTH_SECRET: local-docker-compose-secret-change-me-0123456789
      STORAGE_DRIVER: local
      EMAIL_DRIVER: capture
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - signudoc-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  signudoc-db:
  signudoc-data:
