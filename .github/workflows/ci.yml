name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Poppler's pdfsig, so the seal tests check signatures the way a PDF
      # reader does instead of skipping that part.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm test
      # With nothing configured, as on a first deployment whose database
      # has not been connected yet: the build must not need any of it.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: signudoc
          POSTGRES_PASSWORD: signudoc
          POSTGRES_DB: signudoc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signudoc -d signudoc_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The tests that need a real Postgres: the rate limit statement and
      # the cleanup job's lock.
      - run: npm run test:db
        env:
          E2E_DATABASE_URL: postgres://signudoc:signudoc@127.0.0.1:5432/signudoc_e2e
      - run: npx playwright install --with-deps chromium
      # Starts the app with the eID Easy and Google stand-ins beside it
      # (playwright.config.ts). The Google project (e2e/google-workspace.spec.ts)
      # signs in with Google against the fake Google server, after the main
      # flow has set the site up.
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://signudoc:signudoc@127.0.0.1:5432/signudoc_e2e
      # Full-page screenshots of the administrator's screens
      # (e2e/screenshots.spec.ts), to look at without running the app.
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: test-results/screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: signudoc
          POSTGRES_PASSWORD: signudoc
          POSTGRES_DB: signudoc_docker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signudoc -d signudoc_docker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://signudoc:signudoc@127.0.0.1:5432/signudoc_docker
    steps:
      - uses: actions/checkout@v6
      # The image Cloud Run runs (docs/google-cloud-run.md). Built, never
      # pushed.
      - run: docker build -t signudoc:ci .
      # The migrations run from the image, as the Cloud Run migrate job does.
      - run: docker run --rm --network host -e DATABASE_URL signudoc:ci node db/migrate.mjs
      # The server starts as the image's own user and answers its health
      # check and a page.
      - run: |
          docker run -d --name signudoc --network host \
            -e DATABASE_URL \
            -e APP_URL=http://localhost:8080 \
            -e BETTER_AUTH_SECRET=ci-docker-secret-0123456789abcdef0123456789 \
            -e EMAIL_DRIVER=capture \
            signudoc:ci
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:8080/login
          test "$(docker exec signudoc id -u)" != "0"
      - if: always()
        run: docker logs signudoc || true
